<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ManicWebmaster — OG cover source (1200×630)</title>
<!--
  Source artwork for the Open Graph / Twitter card image.
  Export at exactly 1200×630 to assets/img/og-cover.png:

    1. Open this file in a browser at 1200×630.
    2. Screenshot the .card element (or use a headless capture, e.g.
       `npx playwright screenshot --viewport-size=1200,630 assets/og-cover.html assets/img/og-cover.png`).

  Nothing links to this file from the site; it exists only to produce the PNG.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #07090D;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #F3F6FA;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(900px 500px at 88% -10%, rgba(124,58,237,.20), transparent 60%),
      radial-gradient(700px 420px at 10% 110%, rgba(0,229,255,.12), transparent 60%),
      #07090D;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(120% 90% at 70% 0%, #000, transparent 72%);
  }
  .inner { position: relative; }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 16px; letter-spacing: .18em; text-transform: uppercase;
    color: #00E5FF; margin-bottom: 34px;
  }
  .eyebrow::before { content: ""; width: 10px; height: 10px; background: #00E5FF; }
  h1 {
    font-size: 74px; line-height: 1.03; letter-spacing: -.035em; font-weight: 600;
    max-width: 15ch; margin-bottom: 30px;
  }
  h1 em { font-style: normal; color: #7FE9FF; }
  p { font-size: 25px; color: #99A6B5; max-width: 44ch; line-height: 1.45; }
  .foot {
    position: absolute; left: 80px; right: 80px; bottom: 60px;
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 26px; border-top: 1px solid rgba(255,255,255,.08);
    font-size: 19px; color: #99A6B5;
  }
  .mark { display: flex; align-items: center; gap: 12px; color: #F3F6FA; font-weight: 600; }
  .mark i { width: 13px; height: 13px; background: #00E5FF; display: block; }
  .mark span { color: #99A6B5; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="inner">
      <p class="eyebrow">DFW Web Design + Development</p>
      <h1>Fast, modern websites for <em>small businesses.</em></h1>
      <p>Repair what you have, redesign what isn't working, or build something new — direct with Matt.</p>
    </div>
    <div class="foot">
      <span class="mark"><i></i>Manic<span>Webmaster</span></span>
      <span>manicwebmaster.com</span>
    </div>
  </div>
</body>
</html>
